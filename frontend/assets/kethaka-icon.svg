<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Gold Hexagon Outline -->
  <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" 
           fill="none" 
           stroke="#D4A017" 
           stroke-width="5" 
           stroke-linejoin="round" 
           stroke-linecap="round"/>
  <!-- Stylized Palm Frond / Tree Mark -->
  <!-- Central trunk -->
  <path d="M50,82 L50,22" 
        stroke="#D4A017" 
        stroke-width="4.5" 
        stroke-linecap="round"/>
  <!-- Topmost frond crest -->
  <path d="M50,22 Q50,15 42,16 M50,22 Q50,15 58,16" 
        stroke="#D4A017" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        fill="none"/>
  <!-- Upper Fronds -->
  <path d="M50,34 Q34,26 24,36" 
        stroke="#D4A017" 
        stroke-width="4" 
        stroke-linecap="round" 
        fill="none"/>
  <path d="M50,34 Q66,26 76,36" 
        stroke="#D4A017" 
        stroke-width="4" 
        stroke-linecap="round" 
        fill="none"/>
  <!-- Middle Fronds -->
  <path d="M50,48 Q30,42 20,54" 
        stroke="#D4A017" 
        stroke-width="4" 
        stroke-linecap="round" 
        fill="none"/>
  <path d="M50,48 Q70,42 80,54" 
        stroke="#D4A017" 
        stroke-width="4" 
        stroke-linecap="round" 
        fill="none"/>
  <!-- Lower Fronds -->
  <path d="M50,62 Q34,60 26,72" 
        stroke="#D4A017" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        fill="none"/>
  <path d="M50,62 Q66,60 74,72" 
        stroke="#D4A017" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        fill="none"/>
</svg>
